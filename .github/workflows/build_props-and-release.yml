name: Build and Deploy Props Firmware

on:
  workflow_dispatch:
    inputs:
      refresh_tcd_release:
        description: Rebuild and replace the existing TCD release assets
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  
jobs:
  build-deploy:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - name: "Time Circuits Display"
            path: "CircuitSetup/Time-Circuits-Display"
            folder: "Software/"
            install_path: "Software/install"
            has_sound_pack: true
          - name: "Flux Capacitor"
            path: "CircuitSetup/Flux-Capacitor"
            folder: ""
            install_path: "install"
            has_sound_pack: true
          - name: "SID"
            path: "CircuitSetup/SID"
            folder: ""
            install_path: "install"
            has_sound_pack: false
          - name: "Dash-Gauges"
            path: "CircuitSetup/Dash-Gauges"
            folder: ""
            install_path: "install"
            has_sound_pack: true
          - name: "Remote"
            path: "CircuitSetup/Remote"
            folder: ""
            install_path: "install"
            has_sound_pack: true

    steps:
      - name: Checkout Builder Repo
        uses: actions/checkout@v7

      - name: Get Latest Commit from Target Repo
        id: latest_commit
        run: |
          REPO_INFO=$(curl -s "https://api.github.com/repos/${{ matrix.path }}")
          DEFAULT_BRANCH=$(echo "$REPO_INFO" | jq -r .default_branch)
          if [ -z "$DEFAULT_BRANCH" ] || [ "$DEFAULT_BRANCH" == "null" ]; then
            echo "⚠️ Unable to determine default branch, falling back to 'main'"
            DEFAULT_BRANCH="main"
          fi
          echo "Using branch: $DEFAULT_BRANCH"
          LATEST_COMMIT=$(curl -s "https://api.github.com/repos/${{ matrix.path }}/commits/$DEFAULT_BRANCH" | jq -r .sha)
          if [ -z "$LATEST_COMMIT" ] || [ "$LATEST_COMMIT" == "null" ]; then
            echo "⚠️ Unable to fetch latest commit for $DEFAULT_BRANCH, disabling cache"
            LATEST_COMMIT="no-cache"
          fi
          echo "Using commit hash: $LATEST_COMMIT"
          echo "latest_commit=$LATEST_COMMIT" >> "$GITHUB_OUTPUT"

      - name: Cache target_repo Directory
        id: cache-target-repo
        uses: actions/cache@v6
        with:
          path: target_repo
          key: ${{ runner.os }}-target-repo-${{ matrix.path }}-${{ steps.latest_commit.outputs.latest_commit }}
          restore-keys: |
            ${{ runner.os }}-target-repo-${{ matrix.path }}-

      - name: Clone Target Repo (if cache is empty)
        if: steps.cache-target-repo.outputs.cache-hit != 'true'
        run: |
          if [ -d target_repo ]; then
            echo "Removing existing target_repo directory before cloning"
            rm -rf target_repo
          fi
          git clone https://github.com/${{ matrix.path }} target_repo

      - name: Get Latest Release Tag
        id: latest_release
        run: |
          LATEST_TAG=$(curl -s "https://api.github.com/repos/${{ matrix.path }}/releases/latest" | jq -r .tag_name)
          if [ "$LATEST_TAG" == "null" ]; then
            LATEST_TAG=""
          fi
          echo "Latest release tag: $LATEST_TAG"
          echo "latest_tag=$LATEST_TAG" >> "$GITHUB_OUTPUT"

      - name: Extract and Normalize Firmware Version
        id: get_version
        run: |
          VERSION_PATTERN='#define[[:space:]]+[A-Z_]*VERSION[A-Z_]*[[:space:]]+"[Vv][0-9.]+"'
          RAW_VERSION=$(grep -hRE --include='*_global.h' "$VERSION_PATTERN" target_repo/${{ matrix.folder }}src |
            head -n 1 |
            tr -d '\r' |
            sed -E 's/.*VERSION[A-Z_]*[[:space:]]+"[Vv]([0-9.]+)".*/\1/')
          if [ -z "$RAW_VERSION" ]; then
            echo "❌ Version number not found!"
            exit 1
          fi
          VERSION="v$RAW_VERSION"
          echo "Extracted normalized version: $VERSION"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Compare Version Numbers
        id: check_version
        run: |
          CURRENT_VERSION="${{ steps.get_version.outputs.version }}"
          LAST_VERSION="${{ steps.latest_release.outputs.latest_tag }}"

          if [ "$CURRENT_VERSION" == "$LAST_VERSION" ]; then
            if [ "${{ inputs.refresh_tcd_release }}" == "true" ] && [ "${{ matrix.name }}" == "Time Circuits Display" ]; then
              echo "🔄 Refreshing existing TCD release $CURRENT_VERSION."
              echo "should_build=true" >> "$GITHUB_OUTPUT"
            else
              echo "⚠️ Firmware version has not changed ($CURRENT_VERSION). Stopping job."
              echo "should_build=false" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "✅ New firmware version detected: $CURRENT_VERSION"
            echo "should_build=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout latest TCD sound pack
        if: steps.check_version.outputs.should_build == 'true' && matrix.name == 'Time Circuits Display'
        uses: actions/checkout@v7
        with:
          repository: realA10001986/buildac
          ref: master
          token: ${{ secrets.RELEASE_TOKEN }}
          path: buildac
          fetch-depth: 1
          
      - name: Set up Python
        if: steps.check_version.outputs.should_build == 'true'
        uses: actions/setup-python@v7
        with:
          python-version: '3.x'

      - name: Install PlatformIO
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          pip install platformio
          pip install esptool

      - name: Build Firmware with PlatformIO
        if: steps.check_version.outputs.should_build == 'true'
        run: |
          mkdir -p target_repo/firmware/${{ matrix.name }}
          echo "⚙️ Building default firmware..."
          pio run -d target_repo/${{ matrix.folder }}

      - name: Rename Firmware Binary
        if: steps.check_version.outputs.should_build == 'true'
        id: rename
        run: |
          BIN_PATH=$(find target_repo/${{ matrix.folder }}.pio/build/esp32dev -name firmware.bin | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "❌ Firmware binary not found!"
            exit 1
          fi
          # Replace spaces with underscores in matrix.name
          SAFE_NAME=$(echo "${{ matrix.name }}" | tr ' ' '_')
          NEW_NAME="${SAFE_NAME}_${{ steps.get_version.outputs.version }}.bin"
          mkdir -p target_repo/firmware/"${{ matrix.name }}"
          mv "$BIN_PATH" "target_repo/firmware/${{ matrix.name }}/$NEW_NAME"
          echo "✅ Renamed firmware binary to $NEW_NAME"

      - name: Build Firmware with GTE_KEYPAD (Only for Time Circuits Display)
        if: steps.check_version.outputs.should_build == 'true' && matrix.name == 'Time Circuits Display'
        run: |
          echo "⚙️ Building firmware with GTE_KEYPAD flag..."
          pio run -d target_repo/${{ matrix.folder }} -e GTE

      - name: Rename GTE_KEYPAD Firmware (Only for Time Circuits Display)
        if: steps.check_version.outputs.should_build == 'true' && matrix.name == 'Time Circuits Display'
        run: |
          BIN_PATH=$(find target_repo/${{ matrix.folder }}/.pio/build -name firmware.bin | head -n 1)
          if [ -z "$BIN_PATH" ]; then
            echo "❌ GTE_KEYPAD firmware binary not found!"
            exit 1
          fi
          SAFE_NAME=$(echo "${{ matrix.name }}" | tr ' ' '_')
          NEW_NAME="${SAFE_NAME}_GTE_KEYPAD_${{ steps.get_version.outputs.version }}.bin"
          mv "$BIN_PATH" "target_repo/firmware/${{ matrix.name }}/$NEW_NAME"
          echo "✅ Renamed GTE_KEYPAD firmware -> target_repo/firmware/${{ matrix.name }}/$NEW_NAME"

      - name: Extract Release Notes from Changelog
        if: steps.check_version.outputs.should_build == 'true'
        id: release_notes
        env:
          BASE_DIR: target_repo/${{ matrix.folder }}
          CURRENT_VERSION: ${{ steps.get_version.outputs.version }}
          LAST_VERSION: ${{ steps.latest_release.outputs.latest_tag }}
        run: python scripts/extract_prop_release_notes.py

      - name: Extract Sound Pack Binary
        if: steps.check_version.outputs.should_build == 'true' && matrix.has_sound_pack
        run: |
          install_dir="target_repo/${{ matrix.install_path }}"
          firmware_dir="target_repo/firmware/${{ matrix.name }}"

          if [ "${{ matrix.name }}" == "Time Circuits Display" ]; then
            install_dir="buildac"
          fi

          if [ ! -d "$install_dir" ]; then
            echo "❌ Install directory not found: $install_dir"
            exit 1
          fi

          if [ "${{ matrix.name }}" == "Time Circuits Display" ]; then
            zip_path=$(find "$install_dir" -maxdepth 1 -type f -name 'sound-pack-cs*.zip' | sort -V | tail -n 1)
          else
            zip_path=$(find "$install_dir" -maxdepth 1 -type f -name 'sound-pack-*.zip' | sort -V | tail -n 1)
          fi

          if [ -z "$zip_path" ]; then
            echo "❌ No sound-pack zip found in $install_dir"
            exit 1
          fi

          echo "📦 Extracting sound pack from $zip_path"
          extract_dir=$(mktemp -d)
          unzip -q "$zip_path" -d "$extract_dir"

          mapfile -t sound_bins < <(find "$extract_dir" -type f -name '*.bin' ! -path '*/__MACOSX/*' | sort)
          if [ "${#sound_bins[@]}" -eq 0 ]; then
            echo "❌ No .bin file found inside $zip_path"
            exit 1
          fi

          if [ "${#sound_bins[@]}" -ne 1 ]; then
            echo "❌ Expected exactly one .bin inside $zip_path, found ${#sound_bins[@]}"
            printf '%s\n' "${sound_bins[@]}"
            exit 1
          fi

          cp "${sound_bins[0]}" "$firmware_dir/"
          echo "✅ Added extracted sound-pack binary $(basename "${sound_bins[0]}") to $firmware_dir"

      - name: Create Release on Target Repo
        if: steps.check_version.outputs.should_build == 'true'
        uses: softprops/action-gh-release@v3
        with:
          token: ${{ secrets.RELEASE_TOKEN }}
          repository: ${{ matrix.path }}
          tag_name: ${{ steps.get_version.outputs.version }}
          name: "${{ matrix.name }} Firmware ${{ steps.get_version.outputs.version }}"
          draft: false
          prerelease: false
          generate_release_notes: false
          body: ${{ steps.release_notes.outputs.body }}
          files: |
            target_repo/firmware/${{ matrix.name }}/*.bin
          fail_on_unmatched_files: true



